<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TOSH TECH</title>
<link rel="icon" href="/logo">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Courier New',monospace;font-weight:700;letter-spacing:.5px}
body{background:#000;color:#c5c5c5;min-height:100vh;padding:20px 12px}
.container{max-width:700px;margin:0 auto}

/* BOTÃO DE VOLTAR */
.botao-voltar{position:fixed;top:20px;left:20px;padding:8px 14px;background:transparent;border:1px solid #c5c5c5;color:#c5c5c5;font-size:.8rem;text-transform:uppercase;border-radius:6px;cursor:pointer;transition:.3s ease;z-index:999}
.botao-voltar:hover{background:#c5c5c5;color:#000;box-shadow:0 0 10px rgba(197,197,197,.4)}

.cabecalho{text-align:center;margin-bottom:30px;padding-bottom:15px;border-bottom:1px solid #333;margin-top:45px}
.logo{width:90px;height:90px;border-radius:50%;margin-bottom:12px;border:2px solid #c5c5c5;box-shadow:0 0 12px rgba(192,192,192,.25)}
h1{font-size:1.6rem;color:#c5c5c5;margin-bottom:4px;text-transform:uppercase;text-shadow:0 0 10px rgba(197,197,197,.4)}
.subtitulo{font-size:.85rem;color:#888}

/* VÍDEO CENTRALIZADO */
.video-destaque{width:100%;max-width:500px;margin:0 auto 30px auto;display:block;border-radius:8px;border:1px solid #333;box-shadow:0 0 15px rgba(197,197,197,.2);background:#000}

/* CARTÕES DE RECADOS */
.card{background:#0a0a0a;border-radius:8px;padding:15px;margin-bottom:15px;border:1px solid #222;box-shadow:0 2px 10px rgba(0,0,0,.4);border-left:3px solid #c5c5c5}
.card.promocao{border-left-color:#10b981}
.card.aviso{border-left-color:#f59e0b}
.card.importante{border-left-color:#ef4444}

.titulo{font-size:1.1rem;color:#c5c5c5;margin-bottom:8px;text-transform:uppercase}
.meta{font-size:.8rem;color:#888;margin-bottom:12px;padding-left:10px;border-left:2px solid #333}
.mensagem{font-size:.95rem;line-height:1.6;color:#c5c5c5;white-space:pre-line}

.vazio,.carregando{text-align:center;padding:20px 20px;color:#888;font-size:.9rem}
.rodape{text-align:center;margin-top:40px;padding-top:12px;border-top:1px solid #333;color:#666;font-size:.8rem}
.destaque{color:#c5c5c5;font-weight:700;text-transform:uppercase}
</style>
</head>
<body>

<button class="botao-voltar" onclick="history.back()">VOLTAR</button>

<div class="container">
<header class="cabecalho">
<img src="/logo" alt="Logo Tosh Tech" class="logo">
<h1>RECADOS E PROMOÇÕES</h1>
<p class="subtitulo">ATUALIZAÇÕES OFICIAIS DA EQUIPE TOSH TECH</p>
</header>

<!-- VÍDEO BEM NO CENTRO, ACIMA DO CONTEÚDO -->
<video src="/tutorial7" autoplay loop muted playsinline class="video-destaque">Seu navegador não suporta vídeos.</video>

<div id="conteudo" class="carregando">CARREGANDO INFORMAÇÕES...</div>

<footer class="rodape">
<p><span class="destaque">TOSH TECH</span> • TODOS OS DIREITOS RESERVADOS</p>
</footer>
</div>

<script>
async function carregarRecados(){try{const e=await fetch("/recados-promocoes");const t=await e.json();if(!t.sucesso)throw new Error(t.erro);const n=document.getElementById("conteudo");if(t.recados.length===0){n.innerHTML=`<div class="vazio">NENHUM RECADO PUBLICADO HOJE</div>`;return}n.innerHTML=t.recados.map(e=>`<div class="card ${e.tipo||"geral"}"><div class="titulo">${e.titulo.toUpperCase()}</div><div class="meta">${e.data} • POR ${e.autor.toUpperCase()}</div><div class="mensagem">${e.mensagem}</div></div>`).join("")}catch(e){document.getElementById("conteudo").innerHTML=`<div class="card">ERRO AO CARREGAR: ${e.message.toUpperCase()}</div>`}}
carregarRecados();
</script>
</body>
</html>
