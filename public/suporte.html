<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>TOSH TECH</title>
   <link rel="stylesheet" href="/assets/temas/ToshTech/suporte.css">
</head>
<body class="TOSH_container-suporte">

<video src="/docbord" autoplay muted loop playsinline class="fundo-video"></video>

  <div id="visualizarFoto" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:9999;align-items:center;justify-content:center;padding:15px;box-sizing:border-box;" onclick="fecharFotoAmpliada()">
    <img id="fotoAmpliada" style="max-width:85%;max-height:85vh;border-radius:10px;">
  </div>

  <div class="container-suporte-usuario">
    <header class="cabecalho">
      <button id="btnVoltar" class="btn-secundario" aria-label="Voltar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </button>
      <button id="btnApagarConversa" class="btn-secundario" title="Apagar toda conversa">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
      <img id="logoCabecalho" src="/logo" alt="Tosh Tech" class="logo-tosh" onerror="this.src='/assets/icones/logo-padrao.png'">
      <div class="titulo-pagina">
        <h2>Central de Suporte</h2>
        <p>Atendimento Inteligente</p>
      </div>
      <img id="avatarUsuario" src="/logo" alt="Meu Perfil" class="avatar-perfil" onerror="this.src='/assets/icones/usuario-padrao.png'">
    </header>

    <div class="conteudo">
      <div class="bloco-historico" id="listaMinhasMensagens"></div>
      <div class="bloco-form">
        <button type="button" class="btn-anexo" id="btnAnexar" title="Anexar arquivos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <input type="file" id="arquivoMidia" hidden>
        <div class="grupo-input">
          <div id="campoMensagem" placeholder="Digite sua mensagem..." contenteditable="true"></div>
        </div>
        <button id="btnEnviar" class="btn-principal" aria-label="Enviar mensagem">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/js/suporte.js" defer></script>
</body>
</html>
