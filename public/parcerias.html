<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>TOSH TECH</title><link rel="stylesheet" href="/assets/temas/ToshTech/perfil.css"><style>:root{--fundo:#050505;--prata:#c0c0c0;--prataClaro:#e8e8e8;--prataEscuro:#888;--branco:#fff;--sombraPrata:0 0 15px rgba(192,192,192,.25)}body{background:var(--fundo);color:var(--prata);margin:0;padding:0}.logo-topo{display:block;margin:15px auto 10px;width:70px;height:70px;border-radius:50%;border:2px solid var(--prata);box-shadow:var(--sombraPrata);object-fit:cover}.creditos{text-align:center;font-size:.75rem;color:var(--prataEscuro);margin-bottom:20px}.particula{position:absolute;width:2px;height:2px;background:var(--prataClaro);border-radius:50%;box-shadow:0 0 4px var(--prataClaro);animation:subir 6s infinite ease-out;opacity:0;z-index:0}@keyframes subir{0%{transform:translateY(100px);opacity:0}20%{opacity:.7}100%{transform:translateY(-20px);opacity:0}}.card{position:relative;background:#0a0a0a;border:1px solid var(--prataEscuro);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--sombraPrata);overflow:hidden;z-index:1}.card::before{content:'';position:absolute;inset:-1px;border-radius:13px;background:linear-gradient(90deg,transparent,rgba(192,192,192,.15),transparent);opacity:0;transition:opacity .4s;z-index:-1}.card:hover::before{opacity:1}.btn-img{border:none;background:none;padding:0;cursor:pointer;flex-shrink:0;border-radius:10px;overflow:hidden;border:1px solid var(--prataEscuro)}.btn-img img{width:85px;height:85px;object-fit:cover;transition:transform .3s;display:block}.btn-img:hover img{transform:scale(1.08)}.btn-projeto{background:linear-gradient(180deg,#1a1a1a,#000);color:var(--prataClaro);border:1px solid var(--prata);padding:8px 16px;border-radius:8px;text-decoration:none;font-size:.85rem;font-weight:500;transition:all .3s}.btn-projeto:hover{background:var(--prata);color:#000;box-shadow:0 0 12px var(--prata);transform:translateY(-1px)}#modalImagem{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:9999;align-items:center;justify-content:center;padding:20px}#fecharModal{position:absolute;top:20px;right:25px;background:none;border:none;color:var(--prataClaro);font-size:36px;cursor:pointer;transition:transform .2s}#fecharModal:hover{transform:scale(1.2);color:var(--branco)}#imagemModal{max-width:90%;max-height:85vh;border-radius:8px;border:1px solid var(--prataEscuro);box-shadow:0 0 40px rgba(192,192,192,.3)}</style></head><body><div class="container"><a href="/dashboard" class="btn-voltar" style="color:var(--prata);margin:10px 0;display:inline-flex;align-items:center;gap:5px"><svg class="icone icone-pequeno" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Voltar</a><img src="/logo" alt="Logo" class="logo-topo"><div id="creditosTopo" class="creditos"></div><h1 style="text-align:center;font-size:1.8rem;margin:10px 0;background:linear-gradient(90deg,var(--prataEscuro),var(--prataClaro),var(--prataEscuro));-webkit-background-clip:text;color:transparent">Parcerias Verificadas</h1><p style="text-align:center;font-size:.9rem;margin-bottom:20px;color:var(--prataEscuro)">Projetos oficiais da plataforma</p><hr style="border-color:var(--prataEscuro);opacity:.3"><div id="listaParcerias"><div style="text-align:center;padding:50px 20px;color:var(--prataEscuro)">Carregando...</div></div><div style="text-align:center;margin:25px 0"><a href="/perfil" class="btn-projeto" style="display:inline-flex;align-items:center;gap:6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>Quero ser parceiro</a></div></div><div id="modalImagem"><button id="fecharModal">&times;</button><img id="imagemModal" alt="Imagem completa"></div><script>function criarParticulas(){for(let i=0;i<18;i++){const p=document.createElement('div');p.classList.add('particula');p.style.left=Math.random()*100+'%';p.style.animationDelay=Math.random()*6+'s';p.style.animationDuration=(4+Math.random()*4)+'s';document.body.appendChild(p)}}async function carregarConfig(){try{const r=await fetch('/api/config');const d=await r.json();document.getElementById('creditosTopo').innerHTML=d.NomeApi+' • Criado por '+d.Criador}catch{document.getElementById('creditosTopo').textContent='Tosh Tech • Criado por Tosh'}}async function carregarParcerias(){const c=document.getElementById('listaParcerias');try{const r=await fetch('/api/parcerias');const d=await r.json();if(!d.sucesso||!d.parcerias?.length){c.innerHTML='<div class="card" style="text-align:center;padding:35px"><h3 style="color:var(--prata)">Nenhum projeto aprovado</h3><p style="color:var(--prataEscuro);font-size:.9rem">Aguarde novidades em breve!</p></div>';return}c.innerHTML=d.parcerias.map(p=>`<div class="card"><div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap"><button class="btn-img" onclick="abrirImg('${p.imagem}')"><img src="${p.imagem}" alt="${p.nome_projeto}" loading="lazy"></button><div style="flex:1;min-width:220px"><h3 style="margin:0 0 4px;color:var(--prataClaro);font-size:1.1rem">${p.nome_projeto}</h3><p style="margin:0 0 12px;font-size:.85rem;color:var(--prataEscuro);line-height:1.4">${p.descricao}</p><div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span style="font-size:.8rem;color:var(--prataEscuro)">Por: ${p.autor}</span><a href="${p.referencia}" target="_blank" rel="noopener" class="btn-projeto">Ver projeto</a></div></div></div></div>`).join('');document.getElementById('fecharModal').onclick=fecharImg;document.getElementById('modalImagem').onclick=e=>e.target.id==='modalImagem'&&fecharImg();document.onkeydown=e=>e.key==='Escape'&&fecharImg()}catch{e.innerHTML='<div class="card" style="text-align:center;color:#ff6666">Erro ao carregar</div>'}}function abrirImg(s){document.getElementById('imagemModal').src=s;document.getElementById('modalImagem').style.display='flex';document.body.style.overflow='hidden'}function fecharImg(){document.getElementById('modalImagem').style.display='none';document.body.style.overflow='auto'}criarParticulas();carregarConfig();carregarParcerias();</script></body></html>
